name: Veronica
options:
  bundleIdPrefix: com.tristan.veronica
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
targets:
  Veronica:
    type: application
    platform: macOS
    sources:
      - path: Veronica/Sources
      - path: Veronica/Resources/Engine
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/Runtime
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/Tools
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/VeronicaEngine
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.veronica
        PRODUCT_NAME: Veronica
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Veronica
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Tristan Van Garsse. All rights reserved."
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.13.1
